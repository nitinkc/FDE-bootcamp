site_name: FDE Prep Journal
site_description: Forward Deployed Engineer interview & career prep log
repo_url: https://nitinkc.github.io/forward-deployed-engineer-gcp/
theme:
    name: material
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: cyan
          accent: red
          toggle:
              icon: material/lightbulb-outline
              name: Switch to dark mode
        - media: "(prefers-color-scheme: light)"
          scheme: slate
          primary: amber
          accent: red
          toggle:
              icon: material/lightbulb
              name: Switch to light mode
    features:
        # Navigation
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.expand
        - navigation.path
        - navigation.top # Back-to-top button
        - navigation.footer # Prev/Next page links
        # navigation.instant disabled — breaks live reload (re-enable for production builds)
        # - navigation.instant
        - navigation.instant.progress
        # Search
        - search.suggest
        - search.highlight
        - search.share
        # Content
        - content.code.copy
        - content.code.annotate # (1) style code annotations
        - content.tabs.link # Sync tabs across page
        - content.tooltips

markdown_extensions:
    - admonition
    - tables
    - toc:
          permalink: true
    - pymdownx.highlight
    - pymdownx.superfences
    - pymdownx.tasklist:
          custom_checkbox: false
          clickable_checkbox: true

nav:
    - Home:
        - index: index.md
    - Roadmap Phases:
          - Phase 1 - Foundation: phases/phase-1-foundation.md
          - Phase 2 - Applied AI Engineering: phases/phase-2-applied-ai.md
          - Phase 3 - Agentic Systems: phases/phase-3-agentic-systems.md
          - Phase 4 - Production AI Platforms: phases/phase-4-production-ai.md
          - Phase 5 - FDE Excellence: phases/phase-5-fde-excellence.md
          - Phase 6 - Interview Readiness: phases/phase-6-interview-readiness.md
    - Lessons:
          - Overview: lessons/index.md
          - 01 - Production Software Engineering: lessons/lesson-01-production-software-engineering.md
          - 02 - Data Pipelines & Entity Modeling: lessons/lesson-02-data-pipelines-and-modeling.md
          - 03 - Cloud Core: lessons/lesson-03-cloud-core.md
          - 04 - LLM Foundations: lessons/lesson-04-llm-foundations.md
          - 05 - RAG & Retrieval: lessons/lesson-05-rag-and-retrieval.md
          - 06 - Vector Stores, Eval & Guardrails: lessons/lesson-06-vector-stores-eval-guardrails.md
          - 07 - Agentic Systems: lessons/lesson-07-agentic-systems.md
          - "08 - Production AI: Reliability & Observability": lessons/lesson-08-production-reliability-observability.md
          - "09 - Production AI: Cost, Security & Scale": lessons/lesson-09-production-cost-security-scale.md
          - 10 - FDE Excellence: lessons/lesson-10-fde-excellence.md
          - 11 - Interview Readiness: lessons/lesson-11-interview-readiness.md
    - Project:
          - Overview: projects/overview.md
          - Architecture: projects/architecture.md
    - Interview Prep:
          - Prep Plan: interview-prep/prep-plan.md
